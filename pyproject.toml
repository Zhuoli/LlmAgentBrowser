[project]
name = "llm-browser-agent-demo"
version = "0.1.0"
description = "Demo to evaluate LLM models using browser-use for fetching tweets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "browser-use>=0.7.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.0",
    # MCP dependencies
    "mcp>=1.0.0",
    "anthropic>=0.40.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",  # New Google Gen AI SDK with MCP support
    # Playwright + pycookiecheat dependencies
    "playwright>=1.40.0",
    "pycookiecheat>=0.7.0",
]

[project.scripts]
fetch-tweets = "twitter_tweet_fetcher:main_cli"
